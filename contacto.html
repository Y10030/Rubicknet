        <div class="fila-2">
          <div class="campo"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" required></div>
          <div class="campo">
            <label for="colonia">Colonia o código postal</label>

        <div class="campo">
          <label>Servicio(s) de interés</label>
          <div class="opciones-servicio" role="group" aria-label="Servicios de interés">
            <label class="chip-check"><input type="checkbox" name="servicio" value="Internet"> Internet</label>
            <label class="chip-check"><input type="checkbox" name="servicio" value="Cableado estructurado"> Cableado estructurado</label>
            <label class="chip-check"><input type="checkbox" name="servicio" value="Redes"> Redes</label>

          </div>
        </div>
        <div class="campo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" minlength="10" placeholder="Cuéntanos brevemente qué necesitas (mínimo 10 caracteres)"></textarea>
        </div>
        <button type="submit" class="btn btn-primario btn-bloque">Enviar mensaje</button>
        <p class="aviso-contacto" id="aviso-contacto"></p>
      </form>
    </div>
  </div>
